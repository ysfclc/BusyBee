name: Android validation

on:
  pull_request:
    paths:
      - "android/**"
      - "research/plaintext-observer/**"
      - "rust/**"
      - ".github/workflows/android-validation.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "research/plaintext-observer/**"
      - "rust/**"
      - ".github/workflows/android-validation.yml"

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          if ! cargo ndk --help >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build Rust native libraries
        working-directory: rust
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o ../android/app/src/main/jniLibs \
            build --release --manifest-path Cargo.toml

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          gradle-version: "8.9"

      - name: Make Gradle entrypoint executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Test and assemble owned plaintext observer POC
        run: |
          ./android/gradlew --no-daemon -p research/plaintext-observer/android testDebugUnitTest assembleDebug
