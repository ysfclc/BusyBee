name: Owned plaintext observer POC validation

on:
  pull_request:
    paths:
      - "research/plaintext-observer/**"
      - ".github/workflows/plaintext-poc-validation.yml"
  push:
    branches: [main]
    paths:
      - "research/plaintext-observer/**"
      - ".github/workflows/plaintext-poc-validation.yml"

permissions:
  contents: read

concurrency:
  group: plaintext-poc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          gradle-version: "8.9"

      - name: Make repository Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Run POC unit tests
        run: ./android/gradlew --no-daemon -p research/plaintext-observer/android testDebugUnitTest

      - name: Assemble isolated POC APK
        run: ./android/gradlew --no-daemon -p research/plaintext-observer/android assembleDebug
