name: BusyBee observation and event contract CI

on:
  push:
    paths:
      - 'rust/**'
      - 'android/**'
      - '.github/workflows/driver-event-contract-ci.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'android/**'
      - '.github/workflows/driver-event-contract-ci.yml'

permissions:
  contents: read

concurrency:
  group: busybee-event-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test Rust contract and Android integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust domain core and JNI JSON contract
        run: cargo test --workspace --manifest-path rust/Cargo.toml

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Test Android app and assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          android/gradlew --no-daemon testDebugUnitTest assembleDebug
