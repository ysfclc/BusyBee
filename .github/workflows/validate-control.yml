name: Validate BusyBee control plane

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'docs/**'
      - 'README.md'
      - 'SETUP.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'docs/**'
      - 'README.md'
      - 'SETUP.md'

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate all workflows and embedded shell scripts
        run: "$(go env GOPATH)/bin/actionlint" -color
