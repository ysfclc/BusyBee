name: Build signed BusyBee APK

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'android/**'
      - '.github/workflows/build-signed-apk.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'android/**'
      - '.github/workflows/build-signed-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: busybee-gradle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate workflow
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: false

      - name: Run actionlint
        shell: bash
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml

      - name: Detect stable release-signing secrets
        id: signing-check
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Persistent release signing is configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are incomplete. CI will build a debug APK for validation; add the four secrets in docs/ANDROID_SIGNING.md to produce install-over-existing signed releases."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        shell: bash
        run: cargo install cargo-ndk --locked

      - name: Test Rust domain core
        run: cargo test --workspace --manifest-path rust/Cargo.toml

      - name: Build Rust libraries for Android
        working-directory: rust
        shell: bash
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o ../android/app/src/main/jniLibs \
            build --release --manifest-path Cargo.toml

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          validate-wrappers: false
          cache-read-only: ${{ github.event.pull_request.head.repo.fork == true }}

      - name: Make Gradle entrypoint executable
        run: chmod +x android/gradlew

      - name: Test Android app
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Test and assemble owned plaintext observer POC
        run: |
          ./android/gradlew --no-daemon -p research/plaintext-observer/android testDebugUnitTest assembleDebug

      - name: Prepare release keystore
        id: signing
        if: steps.signing-check.outputs.ready == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/busybee-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$path"
          chmod 600 "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Assemble signed release APK
        if: steps.signing-check.outputs.ready == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.signing.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Assemble debug APK for validation
        if: steps.signing-check.outputs.ready != 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify assembled APK signature
        shell: bash
        env:
          RELEASE_READY: ${{ steps.signing-check.outputs.ready }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_READY" == "true" ]]; then
            APK="android/app/build/outputs/apk/release/app-release.apk"
          else
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Generate APK provenance and checksum
        id: provenance
        shell: bash
        env:
          RELEASE_READY: ${{ steps.signing-check.outputs.ready }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "$RELEASE_READY" == "true" ]]; then
            source_apk="android/app/build/outputs/apk/release/app-release.apk"
            variant="release"
            package_name="com.ysfclc.busybee.drivercommandcentre"
            version_name="0.1.${GITHUB_RUN_NUMBER}"
          else
            source_apk="android/app/build/outputs/apk/debug/app-debug.apk"
            variant="debug"
            package_name="com.ysfclc.busybee.drivercommandcentre.debug"
            version_name="0.1.${GITHUB_RUN_NUMBER}-debug"
          fi
          test -s "$source_apk"
          cp "$source_apk" dist/BusyBee.apk
          apk_sha256="$(sha256sum dist/BusyBee.apk | awk '{print $1}')"
          apk_size="$(wc -c < dist/BusyBee.apk | tr -d ' ')"
          printf '%s  %s\n' "$apk_sha256" "BusyBee.apk" > dist/SHA256SUMS
          export BUILD_VARIANT="$variant" PACKAGE_NAME="$package_name" VERSION_NAME="$version_name"
          export SOURCE_SHA SOURCE_REF APK_SHA256="$apk_sha256" APK_SIZE="$apk_size"
          export BUILD_NUMBER="$GITHUB_RUN_NUMBER" RUN_ID="$GITHUB_RUN_ID"
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export BUILD_TIMESTAMP
          python3 - dist/build-info.json <<'PY'
          import json, os, sys
          data = {
              "product": "BusyBee Driver Command Centre",
              "variant": os.environ["BUILD_VARIANT"],
              "packageName": os.environ["PACKAGE_NAME"],
              "versionCode": int(os.environ["BUILD_NUMBER"]),
              "versionName": os.environ["VERSION_NAME"],
              "sourceCommit": os.environ["SOURCE_SHA"],
              "sourceRef": os.environ["SOURCE_REF"],
              "workflowRunId": os.environ["RUN_ID"],
              "builtAt": os.environ["BUILD_TIMESTAMP"],
              "apk": {
                  "file": "BusyBee.apk",
                  "sha256": os.environ["APK_SHA256"],
                  "sizeBytes": int(os.environ["APK_SIZE"]),
              },
          }
          with open(sys.argv[1], "w", encoding="utf-8") as output:
              json.dump(data, output, indent=2)
              output.write("\n")
          PY
          {
            echo "variant=$variant"
            echo "package=$package_name"
            echo "version=$version_name"
            echo "sha256=$apk_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Publish APK as a GitHub Release asset
        if: github.event_name != 'pull_request'
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}"
          if [[ "${{ steps.signing-check.outputs.ready }}" == "true" ]]; then
            apk="android/app/build/outputs/apk/release/app-release.apk"
            title="BusyBee signed Android build ${GITHUB_RUN_NUMBER}"
            notes="Signed BusyBee Android APK. Package: com.ysfclc.busybee.drivercommandcentre. Version: 0.1.${GITHUB_RUN_NUMBER}."
          else
            apk="android/app/build/outputs/apk/debug/app-debug.apk"
            title="BusyBee debug validation build ${GITHUB_RUN_NUMBER}"
            notes="Debug-only BusyBee APK for validation. Package has the .debug suffix and cannot update the signed release app. Configure the persistent keystore in docs/ANDROID_SIGNING.md for install-over-existing releases."
          fi
          test -s "$apk"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/BusyBee.apk dist/build-info.json dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/BusyBee.apk dist/build-info.json dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes "$notes" --prerelease
          fi
          echo "url=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: Upload pull-request APK and provenance
        id: pr-artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: busybee-pr-${{ github.event.pull_request.number }}-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## BusyBee APK build completed"
            echo "- Variant: ${{ steps.provenance.outputs.variant }}"
            echo "- Package: ${{ steps.provenance.outputs.package }}"
            echo "- Version: ${{ steps.provenance.outputs.version }}"
            echo "- Source commit: ${{ github.event.pull_request.head.sha || github.sha }}"
            echo "- SHA-256: ${{ steps.provenance.outputs.sha256 }}"
            echo "- Signature: verified with apksigner"
            if [[ "${{ steps.signing-check.outputs.ready }}" == "true" ]]; then
              echo "- Signing: persistent release keystore"
              echo "- Updates: compatible with existing release installs using the same key."
            else
              echo "- Signing: CI debug key"
              echo "- Install: separate .debug app; does not update the release package."
            fi
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              echo "- Download: pull-request artifact busybee-pr-${{ github.event.pull_request.number }}-${{ github.run_number }}"
            else
              echo "- Download: ${{ steps.publish.outputs.url }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
