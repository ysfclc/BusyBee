name: Build signed BusyBee APK

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'android/**'
      - '.github/workflows/build-signed-apk.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'android/**'
      - '.github/workflows/build-signed-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: busybee-signed-apk
  cancel-in-progress: false

jobs:
  build:
    name: Test and build signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate workflow
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: false

      - name: Run actionlint
        shell: bash
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" .github/workflows/build-signed-apk.yml

      - name: Detect stable release-signing secrets
        id: signing-check
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Persistent release signing is configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are incomplete. CI will build a debug APK for validation; add the four secrets in docs/ANDROID_SIGNING.md to produce install-over-existing signed releases."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        shell: bash
        run: cargo install cargo-ndk --locked

      - name: Test Rust domain core
        run: cargo test --workspace --manifest-path rust/Cargo.toml

      - name: Build Rust libraries for Android
        shell: bash
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o android/app/src/main/jniLibs \
            build --release --manifest-path rust/Cargo.toml

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Make Gradle entrypoint executable
        run: chmod +x android/gradlew

      - name: Test Android app
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Make Gradle entrypoint executable
        run: chmod +x android/gradlew

      - name: Prepare release keystore
        id: signing
        if: steps.signing-check.outputs.ready == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/busybee-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$path"
          chmod 600 "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Assemble signed release APK
        if: steps.signing-check.outputs.ready == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.signing.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Assemble debug APK for validation
        if: steps.signing-check.outputs.ready != 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify signed APK signature
        if: steps.signing-check.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload signed APK
        if: steps.signing-check.outputs.ready == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: BusyBee-Driver-Command-Centre-signed-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        if: steps.signing-check.outputs.ready != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: BusyBee-Driver-Command-Centre-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        shell: bash
        run: |
          {
            if [[ "${{ steps.signing-check.outputs.ready }}" == "true" ]]; then
              echo "## Signed APK ready"
              echo "- Package: com.ysfclc.busybee.drivercommandcentre"
              echo "- Version: 0.1.${{ github.run_number }}"
              echo "- Signing: verified with apksigner"
              echo "- Updates: same package ID and signing certificate preserve app data."
            else
              echo "## Debug APK built — release signing still required"
              echo "- Debug package uses a separate .debug application ID."
              echo "- Configure the persistent release keystore using docs/ANDROID_SIGNING.md."
              echo "- A debug APK cannot update or preserve data from the signed release package."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
