name: App Observer Lab APK

on:
  push:
    branches:
      - research/app-observer-lab-2026-11-16
    paths:
      - 'research/app-observer/**'
      - '.github/workflows/app-observer-lab.yml'
      - 'android/gradlew'
      - 'android/gradle/**'
  pull_request:
    paths:
      - 'research/app-observer/**'
      - '.github/workflows/app-observer-lab.yml'
      - 'android/gradlew'
      - 'android/gradle/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build standalone diagnostic APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: research/app-observer/android/**/*.gradle.kts
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test and assemble standalone APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          android/gradlew -p research/app-observer/android --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="research/app-observer/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee research/app-observer/android/app/build/outputs/apk/debug/SHA256SUMS
          ls -lh "$APK"
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: app-observer-lab-debug
          path: |
            research/app-observer/android/app/build/outputs/apk/debug/app-debug.apk
            research/app-observer/android/app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
